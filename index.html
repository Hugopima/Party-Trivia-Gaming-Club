<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Party Trivia - Gaming Club Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --bg: #1a1a2e; --panel: #16213e; --accent: #e94560; --text: #ffffff; --success: #40f09b; --warning: #fbc531; --btn-bg: #0f3460; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: var(--panel); padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); width: 95%; max-width: 700px; text-align: center; border-bottom: 5px solid var(--accent); position: relative; }
        
        h1 { color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .credits { font-size: 0.8em; color: #a29bfe; margin-bottom: 20px; border-bottom: 1px solid #533483; padding-bottom: 10px; }
        .promo-link { display: inline-block; margin-top: 15px; color: var(--success); text-decoration: none; font-weight: bold; font-size: 0.9em; border: 1px solid var(--success); padding: 5px 10px; border-radius: 5px; transition: 0.3s; }
        
        input[type="text"] { width: 85%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; background: var(--btn-bg); color: white; outline: none; }
        button { padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; }
        .btn-main { background: var(--accent); width: 90%; }
        .btn-success { background: var(--success); color: #1a1a2e; }
        .btn-danger { background: #d63031; }
        .btn-back { background: var(--btn-bg); color: #a29bfe; border: 1px solid #533483; }
        .btn-round { background: #00a8ff; color: white; margin-top: 15px; width: 90%; }
        .active-tool { background: var(--accent) !important; box-shadow: 0 0 10px var(--accent); border: 2px solid white !important; }
        .hidden { display: none !important; }

        #notification { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 10px; background: var(--accent); color: white; font-weight: bold; z-index: 2000; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .toolbar { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; align-items: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; flex-wrap: wrap; }
        .color-picker { width: 45px; height: 45px; border: none; border-radius: 50%; cursor: pointer; background: none; }
        .color-picker::-webkit-color-swatch { border-radius: 50%; border: 2px solid white; }
        .size-btn { background: var(--btn-bg); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; border: 2px solid transparent; }
        
        canvas { border: 4px solid #0f3460; background: white; border-radius: 10px; touch-action: none; max-width: 100%; cursor: crosshair; }
        .tema-box { background: var(--warning); color: #000; padding: 12px; border-radius: 10px; font-weight: bold; margin-bottom: 15px; font-size: 1.2em; }
        
        .lobby-box { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; margin: 10px 0; min-height: 35px; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        .user-tag { background: var(--btn-bg); padding: 3px 8px; border-radius: 12px; border: 1px solid var(--accent); font-size: 11px; font-weight: bold; color: #fff; }
        
        .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .reveal-card { background: var(--btn-bg); padding: 10px; border-radius: 12px; border: 2px solid #533483; }
        .reveal-card img { width: 100%; border-radius: 8px; background: white; cursor: zoom-in; }

        #zoom-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; flex-direction: column; }
        #zoom-img { max-width: 90%; max-height: 80%; border: 5px solid white; border-radius: 10px; background: white; }
        .org-card { background: var(--btn-bg); margin: 8px 0; padding: 10px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid var(--success); }
        .org-card img { width: 60px; height: 60px; background: white; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="notification"></div>

<div id="zoom-overlay" onclick="this.style.display='none'">
    <h2 id="zoom-nombre" style="margin-bottom: 10px; color: var(--warning);"></h2>
    <img id="zoom-img" src="">
</div>

<div class="container">
    <div id="menu-inicio">
        <h1>🎙️ PARTY TRIVIA</h1>
        <div class="credits">Desarrollado por <b>Gaming Club</b> 🚀</div>
        <button class="btn-main" onclick="mostrarCrear()">CREAR NUEVA PARTIDA</button>
        <button class="btn-main" style="background:var(--btn-bg)" onclick="mostrarUnirse()">UNIRSE A SALA</button>
        <br>
        <a href="https://hugopima.github.io/Qui-n-es-Qui-n---Gaming-Club/" target="_blank" class="promo-link">🕵️ Juega a "Quién es Quién" aquí</a>
    </div>

    <div id="pantalla-crear" class="hidden">
        <h2 style="color:var(--warning)">LOBBY HOST</h2>
        <h1 id="codigo-generado" style="font-size: 4em; color: var(--accent); margin: 5px 0;">----</h1>
        <div class="lobby-box" id="lista-espera-org"></div>
        <input type="text" id="input-tema" placeholder="Escribe el tema de la ronda...">
        <button class="btn-success" onclick="iniciarPartida()" style="width:90%">🚀 LANZAR TEMA</button>
        <button class="btn-back" onclick="irInicio()" style="width:90%">CANCELAR PARTIDA</button>
    </div>

    <div id="pantalla-unirse" class="hidden">
        <h2>ÚNETE</h2>
        <input type="text" id="input-nombre" placeholder="Tu Apodo...">
        <input type="text" id="input-sala" placeholder="Código">
        <button class="btn-main" onclick="entrarLobbyJugador()">ENTRAR AL LOBBY</button>
        <button class="btn-back" onclick="irInicio()">VOLVER</button>
    </div>

    <div id="lobby-jugador" class="hidden">
        <h2 id="wait-room-id" style="color:var(--accent)">SALA: ----</h2>
        <div class="lobby-box" id="lista-espera-jugador"></div>
        <p style="color:var(--warning); font-size: 0.9em;">Esperando tema del Host...</p>
        <button class="btn-back" onclick="irInicio()">SALIR</button>
    </div>

    <div id="panel-jugador" class="hidden">
        <div id="tema-jugador" class="tema-box">¡A DIBUJAR!</div>
        <div class="toolbar">
            <input type="color" id="color-picker" class="color-picker" value="#333333" onchange="setCol(this.value)">
            <button class="tool active-tool" id="t-pincel" onclick="setTool('pincel')">✏️</button>
            <button class="tool" id="t-goma" onclick="setTool('goma')">🧽</button>
            <div style="width:2px; height:30px; background:white; margin:0 5px;"></div>
            <button class="size-btn" id="s-4" onclick="setSize(4)">●</button>
            <button class="size-btn active-tool" id="s-10" onclick="setSize(10)">●</button>
            <button class="size-btn" id="s-25" onclick="setSize(25)">⬤</button>
        </div>
        <canvas id="pizarra" width="350" height="350"></canvas>
        <button class="btn-danger" style="width:90%" onclick="borrar()">BORRAR TODO</button>
        <div id="galeria-jugadores" class="galeria"></div>
    </div>

    <div id="panel-org" class="hidden">
        <h3 style="color:var(--warning)">SALA: <span id="room-id-active"></span></h3>
        <div style="display: flex; gap: 5px; justify-content: center;">
            <button class="btn-danger" id="btn-block-lock" onclick="bloquear(true)">🔒 BLOQUEAR</button>
            <button class="btn-success" id="btn-block-open" onclick="bloquear(false)">🔓 ABRIR</button>
        </div>
        <div id="pizarras-org-vivas"></div>
        <button class="btn-round" onclick="nuevaRonda()">🔄 NUEVO TEMA / SIGUIENTE RONDA</button>
        <button onclick="limpiarSala()" class="btn-back" style="width:90%">🗑️ CERRAR SALA</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCHUp4WvkkhfMnQCMH-lku3LMblH07EM9s",
        authDomain: "party-trivia-gaming-club.firebaseapp.com",
        databaseURL: "https://party-trivia-gaming-club-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "party-trivia-gaming-club",
        storageBucket: "party-trivia-gaming-club.firebasestorage.app",
        messagingSenderId: "505319413692",
        appId: "1:505319413692:web:6f57edc3c7d63e49ce3db9"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let roomID, miNombre, dibujando = false, bloqueado = false;
    let tool = 'pincel', size = 10, colorActual = '#333333';
    const canvas = document.getElementById('pizarra');
    const ctx = canvas.getContext('2d');

    window.onload = () => {
        const r = localStorage.getItem('pt_room');
        const n = localStorage.getItem('pt_name');
        const role = localStorage.getItem('pt_role');
        if(r && n && role) {
            roomID = r; miNombre = n;
            database.ref('salas/'+roomID+'/estado').once('value', snap => {
                const est = snap.val();
                document.getElementById('menu-inicio').classList.add('hidden');
                if(role === 'org') {
                    if(est && est.pregunta) iniciarPartida(true);
                    else mostrarCrear(true);
                } else entrarLobbyJugador(true);
            });
        }
    }

    function showNotify(msg, color) {
        const n = document.getElementById('notification');
        n.innerText = msg; n.style.background = color || 'var(--accent)';
        n.style.display = 'block'; setTimeout(() => { n.style.display = 'none'; }, 2000);
    }

    function irInicio() { localStorage.clear(); location.reload(); }
    
    function setTool(t) { 
        tool = t; 
        document.getElementById('t-pincel').classList.toggle('active-tool', t === 'pincel'); 
        document.getElementById('t-goma').classList.toggle('active-tool', t === 'goma'); 
    }
    
    function setCol(c) { colorActual = c; setTool('pincel'); }
    
    function setSize(s) { 
        size = s; 
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active-tool')); 
        document.getElementById('s-'+s).classList.add('active-tool'); 
    }

    function openZoom(nombre, src) { 
        document.getElementById('zoom-nombre').innerText = nombre; 
        document.getElementById('zoom-img').src = src; 
        document.getElementById('zoom-overlay').style.display = 'flex'; 
    }

    function getCanvasData() {
        const temp = document.createElement('canvas'); temp.width = 350; temp.height = 350;
        const tCtx = temp.getContext('2d'); tCtx.fillStyle = "#FFF"; tCtx.fillRect(0,0,350,350);
        tCtx.drawImage(canvas,0,0); return temp.toDataURL("image/jpeg", 0.7);
    }

    function mostrarCrear(auto = false) {
        document.getElementById('menu-inicio').classList.add('hidden');
        document.getElementById('pantalla-crear').classList.remove('hidden');
        if(!auto) {
            roomID = Math.floor(1000 + Math.random() * 9000).toString();
            localStorage.setItem('pt_room', roomID); localStorage.setItem('pt_name', 'Host'); localStorage.setItem('pt_role', 'org');
        }
        document.getElementById('codigo-generado').innerText = roomID;
        vincularLobby();
    }

    function vincularLobby() {
        database.ref('salas/'+roomID+'/jugadores').on('value', snap => {
            let h = `<div class="user-tag" style="color:var(--warning)">👑 HOST</div>`;
            const d = snap.val(); for(let id in d) if(d[id].nombre !== "Host") h += `<div class="user-tag">👤 ${d[id].nombre}</div>`;
            const lOrg = document.getElementById('lista-espera-org'); if(lOrg) lOrg.innerHTML = h;
            const lJug = document.getElementById('lista-espera-jugador'); if(lJug) lJug.innerHTML = h;
        });
    }

    function iniciarPartida(auto = false) {
        if(!auto) {
            const t = document.getElementById('input-tema').value; if(!t) return alert("Pon un tema");
            database.ref('salas/'+roomID+'/estado').update({ pregunta: t, activa: true, bloqueado: false });
            showNotify("🚀 ¡TEMA LANZADO!", "var(--success)");
        }
        document.getElementById('menu-inicio').classList.add('hidden');
        document.getElementById('pantalla-crear').classList.add('hidden');
        document.getElementById('panel-org').classList.remove('hidden');
        document.getElementById('room-id-active').innerText = roomID;
        escucharPizarrasVivo();
    }

    function mostrarUnirse() { document.getElementById('menu-inicio').classList.add('hidden'); document.getElementById('pantalla-unirse').classList.remove('hidden'); }

    function entrarLobbyJugador(auto = false) {
        if(!auto) {
            const n = document.getElementById('input-nombre').value.trim();
            const r = document.getElementById('input-sala').value.trim();
            if(!n || !r) return alert("Faltan datos");
            database.ref('salas/'+r+'/jugadores').once('value', snap => {
                const d = snap.val(); let existe = false;
                for(let id in d) { if(d[id].nombre.toLowerCase() === n.toLowerCase()) existe = true; }
                if(existe) alert("Ese nombre ya está en uso.");
                else {
                    miNombre = n; roomID = r;
                    localStorage.setItem('pt_room', roomID); localStorage.setItem('pt_name', miNombre); localStorage.setItem('pt_role', 'jug');
                    database.ref('salas/'+roomID+'/jugadores/'+miNombre).update({ nombre: miNombre, visible: false });
                    continuarLobby();
                }
            });
        } else continuarLobby();
    }

    function continuarLobby() {
        document.getElementById('menu-inicio').classList.add('hidden'); document.getElementById('pantalla-unirse').classList.add('hidden');
        document.getElementById('lobby-jugador').classList.remove('hidden'); document.getElementById('wait-room-id').innerText = "SALA: " + roomID;
        vincularLobby();
        database.ref('salas/'+roomID+'/estado').on('value', snap => {
            const est = snap.val();
            if(est && est.pregunta) {
                document.getElementById('lobby-jugador').classList.add('hidden'); document.getElementById('panel-jugador').classList.remove('hidden');
                bloqueado = est.bloqueado; document.getElementById('tema-jugador').innerText = bloqueado ? "🔒 BLOQUEADO" : "TEMA: " + est.pregunta;
                document.getElementById('tema-jugador').style.background = bloqueado ? "#d63031" : "#fbc531";
                const b = localStorage.getItem('pt_backup'); if(b && !bloqueado) { const img = new Image(); img.onload = () => ctx.drawImage(img,0,0); img.src = b; }
            } else if (roomID && (!est || !est.pregunta)) {
                document.getElementById('panel-jugador').classList.add('hidden'); document.getElementById('lobby-jugador').classList.remove('hidden');
            }
        });
        database.ref('salas/'+roomID+'/jugadores').on('value', snap => {
            const gal = document.getElementById('galeria-jugadores'); gal.innerHTML = ""; const d = snap.val();
            for(let id in d) if(d[id].visible) gal.innerHTML += `<div class="reveal-card"><b>${d[id].nombre}</b><img src="${d[id].dibujo}" onclick="openZoom('${d[id].nombre}', this.src)"></div>`;
        });
    }

    function escucharPizarrasVivo() {
        database.ref('salas/'+roomID+'/jugadores').on('value', snap => {
            const b = document.getElementById('pizarras-org-vivas'); if(!b) return; b.innerHTML = ""; const d = snap.val();
            for(let id in d) if(d[id].nombre !== "Host") b.innerHTML += `<div class="org-card"><img src="${d[id].dibujo || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'}" onclick="openZoom('${d[id].nombre}', this.src)"><span><b>${d[id].nombre}</b></span><button class="btn-success" style="width:auto" onclick="revelar('${d[id].nombre}', ${!d[id].visible})">${d[id].visible ? '👁️ OK' : '👁️ REVELAR'}</button></div>`;
        });
    }

    function bloquear(v) { 
        database.ref('salas/'+roomID+'/estado').update({ bloqueado: v }); 
        showNotify(v ? "🔒 BLOQUEADAS" : "🔓 ABIERTAS", v ? "#d63031" : "#40f09b");
    }
    function revelar(n, v) { database.ref('salas/'+roomID+'/jugadores/'+n).update({ visible: v }); }
    function nuevaRonda() {
        if(confirm("¿Siguiente ronda?")) {
            database.ref('salas/'+roomID+'/estado').update({ pregunta: "", bloqueado: false });
            database.ref('salas/'+roomID+'/jugadores').once('value', s => { s.forEach(c => { if(c.key !== "Host") c.ref.update({ dibujo: "", visible: false }); }); });
            localStorage.removeItem('pt_backup'); location.reload();
        }
    }
    function limpiarSala() { if(confirm("¿Cerrar sala?")) { database.ref('salas/'+roomID).remove(); irInicio(); } }

    const getPos = (e) => { const r = canvas.getBoundingClientRect(); const x = e.touches ? e.touches[0].clientX : e.clientX; const y = e.touches ? e.touches[0].clientY : e.clientY; return { x: x - r.left, y: y - r.top }; };
    
    // FUNCIÓN DE DIBUJO CORREGIDA (Líneas dinámicas)
    const updateV = () => { if(!bloqueado && roomID && miNombre) { const d = getCanvasData(); database.ref('salas/'+roomID+'/jugadores/'+miNombre).update({ dibujo: d }); localStorage.setItem('pt_backup', d); } };
    
    canvas.addEventListener('mousedown', (e) => { 
        if(!bloqueado){ 
            dibujando=true; ctx.beginPath(); const p=getPos(e); ctx.moveTo(p.x, p.y); 
            ctx.lineWidth = size; ctx.lineCap = "round"; ctx.strokeStyle = (tool === 'pincel') ? colorActual : "#FFFFFF";
        }
    });
    canvas.addEventListener('mousemove', (e) => { 
        if(dibujando && !bloqueado){ 
            const p=getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); 
        }
    });
    window.addEventListener('mouseup', () => { if(dibujando) updateV(); dibujando=false; });
    
    canvas.addEventListener('touchstart', (e) => { 
        if(!bloqueado){ 
            e.preventDefault(); dibujando=true; ctx.beginPath(); const p=getPos(e); ctx.moveTo(p.x, p.y); 
            ctx.lineWidth = size; ctx.lineCap = "round"; ctx.strokeStyle = (tool === 'pincel') ? colorActual : "#FFFFFF";
        }
    });
    canvas.addEventListener('touchmove', (e) => { 
        if(dibujando && !bloqueado){ 
            e.preventDefault(); const p=getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); 
        }
    });
    canvas.addEventListener('touchend', () => { if(dibujando) updateV(); dibujando=false; });

    function borrar() { if(confirm("¿Borrar?")) { ctx.clearRect(0,0,350,350); localStorage.removeItem('pt_backup'); updateV(); } }
</script>
</body>
</html>
