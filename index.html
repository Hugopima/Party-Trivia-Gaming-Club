<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Party Trivia - Gaming Club 👑</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --bg: #1a1a2e; --panel: #16213e; --accent: #e94560; --text: #ffffff; --success: #40f09b; --warning: #fbc531; --btn-bg: #0f3460; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: var(--panel); padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); width: 95%; max-width: 700px; text-align: center; border-bottom: 5px solid var(--accent); position: relative; }
        
        h1 { color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .credits { font-size: 0.8em; color: #a29bfe; margin-bottom: 20px; border-bottom: 1px solid #533483; padding-bottom: 10px; }
        
        input[type="text"] { width: 85%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; background: var(--btn-bg); color: white; outline: none; }
        button { padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; }
        .btn-main { background: var(--accent); width: 90%; }
        .btn-success { background: var(--success); color: #1a1a2e; }
        .btn-danger { background: #d63031; }
        .btn-back { background: var(--btn-bg); color: #a29bfe; border: 1px solid #533483; }
        .btn-round { background: #00a8ff; color: white; margin-top: 15px; width: 90%; }
        .active-tool { background: var(--accent) !important; box-shadow: 0 0 10px var(--accent); border: 2px solid white !important; }
        .hidden { display: none !important; }

        #notification { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 10px; background: var(--accent); color: white; font-weight: bold; z-index: 2000; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .toolbar { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; align-items: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; flex-wrap: wrap; }
        canvas { border: 4px solid #0f3460; background: white; border-radius: 10px; touch-action: none; width: 100%; max-width: 500px; height: auto; cursor: crosshair; }
        
        .lobby-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; margin: 15px 0; min-height: 50px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .user-tag { background: var(--btn-bg); padding: 5px 12px; border-radius: 15px; border: 1px solid var(--accent); font-size: 13px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 5px; }
        
        .reveal-card { background: white; padding: 10px; border-radius: 12px; border: 2px solid var(--accent); color: #1a1a2e; }
        #zoom-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; flex-direction: column; }
        #zoom-img { max-width: 90%; max-height: 80%; border: 5px solid white; border-radius: 10px; background: white; }
        .config-row { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.9em; }
        .org-card { background: var(--btn-bg); margin: 8px 0; padding: 10px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid var(--success); }
        .org-card img { width: 60px; height: 60px; background: white; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="notification"></div>
<div id="zoom-overlay" onclick="this.style.display='none'">
    <h2 id="zoom-nombre" style="margin-bottom: 10px; color: var(--warning);"></h2>
    <img id="zoom-img" src="">
</div>

<div class="container">
    <div id="menu-inicio">
        <h1>🎙️ PARTY TRIVIA</h1>
        <div class="credits">Desarrollado por <b>Gaming Club</b> 🚀</div>
        <button class="btn-main" onclick="mostrarPantallaNombreHost()">CREAR NUEVA PARTIDA</button>
        <button class="btn-main" style="background:var(--btn-bg)" onclick="mostrarUnirse()">UNIRSE A SALA</button>
    </div>

    <div id="pantalla-nombre-host" class="hidden">
        <h2>TU APODO (HOST)</h2>
        <input type="text" id="host-nickname" placeholder="Escribe tu nombre...">
        <button class="btn-main" onclick="crearSalaLobby()">CREAR SALA</button>
        <button class="btn-back" onclick="irInicio()">VOLVER</button>
    </div>

    <div id="pantalla-crear" class="hidden">
        <h2 style="color:var(--warning)">LOBBY DE ESPERA</h2>
        <h1 id="codigo-generado" style="font-size: 4em; color: var(--accent); margin: 5px 0; letter-spacing: 5px;">----</h1>
        <div class="lobby-box" id="lista-espera-org"></div>
        <div id="ajustes-host-real" class="config-row">
            <input type="checkbox" id="check-random" style="width:20px; height:20px; cursor:pointer;">
            <label for="check-random">🔄 Rotar organizador cada ronda</label>
        </div>
        <input type="text" id="input-tema" placeholder="Introduce el tema para empezar...">
        <button class="btn-success" onclick="iniciarPartida()" style="width:90%">🚀 LANZAR TEMA</button>
        <button class="btn-back" onclick="irInicio()" style="width:90%">CANCELAR PARTIDA</button>
    </div>

    <div id="pantalla-unirse" class="hidden">
        <h2>ÚNETE A UNA SALA</h2>
        <input type="text" id="input-nombre" placeholder="Tu Apodo...">
        <input type="text" id="input-sala" placeholder="Código">
        <button class="btn-main" onclick="entrarLobbyJugador()">ENTRAR AL LOBBY</button>
        <button class="btn-back" onclick="irInicio()">VOLVER</button>
    </div>

    <div id="lobby-jugador" class="hidden">
        <h2 id="wait-room-id" style="color:var(--accent)">SALA: ----</h2>
        <div class="lobby-box" id="lista-espera-jugador"></div>
        <p id="txt-espera" style="color:var(--warning); font-size: 1.1em; font-weight: bold;">Esperando tema...</p>
        <button class="btn-back" onclick="irInicio()">SALIR</button>
    </div>

    <div id="panel-jugador" class="hidden">
        <div id="tema-jugador" style="background: var(--warning); color: #000; padding: 12px; border-radius: 10px; font-weight: bold; margin-bottom: 15px; font-size: 1.2em;">TEMA: ---</div>
        <div class="toolbar">
            <input type="color" id="color-picker" style="width:45px; height:45px; border:none; cursor:pointer; background:none;" value="#333333" onchange="setCol(this.value)">
            <button id="t-pincel" class="active-tool" onclick="setTool('pincel')">✏️</button>
            <button id="t-goma" onclick="setTool('goma')">🧽</button>
            <button onclick="setSize(4)">●</button>
            <button id="s-10" class="active-tool" onclick="setSize(10)">●</button>
            <button onclick="setSize(25)">⬤</button>
        </div>
        <canvas id="pizarra" width="500" height="500"></canvas>
        <button class="btn-danger" style="width:90%" onclick="borrar()">BORRAR TODO</button>
        <div id="galeria-jugadores" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px;"></div>
    </div>

    <div id="panel-org" class="hidden">
        <h3 style="color:var(--warning)">CONTROL DE SALA: <span id="room-id-active"></span></h3>
        <p id="info-admin" style="font-size:0.9em; margin-top:-10px;"></p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn-danger" onclick="bloquear(true)">🔒 BLOQUEAR</button>
            <button class="btn-success" onclick="bloquear(false)">🔓 ABRIR</button>
        </div>
        <div id="pizarras-org-vivas" style="margin-top:20px;"></div>
        <button class="btn-round" onclick="nuevaRonda()">🔄 SIGUIENTE RONDA</button>
        <button id="btn-cerrar-sala" onclick="limpiarSala()" class="btn-back hidden" style="width:90%">🗑️ CERRAR SALA</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCHUp4WvkkhfMnQCMH-lku3LMblH07EM9s",
        authDomain: "party-trivia-gaming-club.firebaseapp.com",
        databaseURL: "https://party-trivia-gaming-club-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "party-trivia-gaming-club",
        storageBucket: "party-trivia-gaming-club.firebasestorage.app",
        messagingSenderId: "505319413692",
        appId: "1:505319413692:web:6f57edc3c7d63e49ce3db9"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let roomID, miNombre, dibujando = false, bloqueado = false;
    let tool = 'pincel', size = 10, colorActual = '#333333', hostRealUID = "";
    const canvas = document.getElementById('pizarra');
    const ctx = canvas.getContext('2d');

    window.onload = () => {
        const r = localStorage.getItem('pt_room');
        const n = localStorage.getItem('pt_name');
        const h = localStorage.getItem('pt_host_uid');
        if(r && n) {
            roomID = r; miNombre = n; hostRealUID = h || "";
            vincularLobby();
            escucharEstado();
        }
    }

    function showNotify(msg, color) {
        const n = document.getElementById('notification');
        n.innerText = msg; n.style.background = color || 'var(--accent)';
        n.style.display = 'block'; setTimeout(() => { n.style.display = 'none'; }, 2000);
    }

    function irInicio() { localStorage.clear(); location.reload(); }
    function setTool(t) { tool = t; document.getElementById('t-pincel').classList.toggle('active-tool', t === 'pincel'); document.getElementById('t-goma').classList.toggle('active-tool', t === 'goma'); }
    function setCol(c) { colorActual = c; setTool('pincel'); }
    function setSize(s) { size = s; }
    function openZoom(nombre, src) { document.getElementById('zoom-nombre').innerText = nombre; document.getElementById('zoom-img').src = src; document.getElementById('zoom-overlay').style.display = 'flex'; }

    function mostrarPantallaNombreHost() {
        document.getElementById('menu-inicio').classList.add('hidden');
        document.getElementById('pantalla-nombre-host').classList.remove('hidden');
    }

    function crearSalaLobby() {
        const nick = document.getElementById('host-nickname').value.trim();
        if(!nick) return alert("Ponte un nombre");
        miNombre = nick;
        roomID = Math.floor(1000 + Math.random() * 9000).toString();
        hostRealUID = Date.now().toString();
        localStorage.setItem('pt_room', roomID);
        localStorage.setItem('pt_name', miNombre);
        localStorage.setItem('pt_host_uid', hostRealUID);

        database.ref('salas/'+roomID+'/estado').set({ 
            organizadorActual: miNombre, 
            rotar: false, 
            activa: false, 
            hostRealUID: hostRealUID,
            historialAdmins: [miNombre]
        });
        database.ref('salas/'+roomID+'/jugadores/'+miNombre).set({ nombre: miNombre, visible: false });
        vincularLobby();
        escucharEstado();
    }

    function vincularLobby() {
        if(!roomID) return;
        // Escuchamos quién es el organizador actual para poner la corona
        database.ref('salas/'+roomID+'/estado/organizadorActual').on('value', adminSnap => {
            const currentAdmin = adminSnap.val();
            // Escuchamos la lista de jugadores
            database.ref('salas/'+roomID+'/jugadores').on('value', snap => {
                let h = "";
                snap.forEach(j => {
                    const nombreJ = j.val().nombre;
                    const esAdmin = (nombreJ === currentAdmin);
                    h += `<div class="user-tag">${esAdmin ? '👑 ' : '👤 '}${nombreJ}</div>`;
                });
                const lOrg = document.getElementById('lista-espera-org'); if(lOrg) lOrg.innerHTML = h;
                const lJug = document.getElementById('lista-espera-jugador'); if(lJug) lJug.innerHTML = h;
            });
        });
    }

    function escucharEstado() {
        database.ref('salas/'+roomID+'/estado').on('value', snap => {
            const est = snap.val();
            if(!est) return;

            const soyOrganizadorAhora = (miNombre === est.organizadorActual);
            const soyElDueñoReal = (hostRealUID === est.hostRealUID);
            
            document.getElementById('menu-inicio').classList.add('hidden');
            document.getElementById('pantalla-nombre-host').classList.add('hidden');

            if(soyOrganizadorAhora) {
                // Si la partida no está activa (Estamos en el Lobby inicial)
                if(!est.activa) {
                    document.getElementById('pantalla-crear').classList.remove('hidden');
                    document.getElementById('panel-org').classList.add('hidden');
                    document.getElementById('ajustes-host-real').classList.toggle('hidden', !soyElDueñoReal);
                } else {
                    // Partida activa: Mostrar Panel de Control
                    document.getElementById('pantalla-crear').classList.add('hidden');
                    document.getElementById('panel-org').classList.remove('hidden');
                    escucharPizarrasVivo();
                }
                document.getElementById('lobby-jugador').classList.add('hidden');
                document.getElementById('panel-jugador').classList.add('hidden');
                document.getElementById('codigo-generado').innerText = roomID;
                document.getElementById('room-id-active').innerText = roomID;
                document.getElementById('info-admin').innerText = soyElDueñoReal ? "👑 Host de la Sala" : "👑 Te toca organizar";
                document.getElementById('btn-cerrar-sala').classList.toggle('hidden', !soyElDueñoReal);
            } else {
                // Soy Jugador
                document.getElementById('pantalla-crear').classList.add('hidden');
                document.getElementById('panel-org').classList.add('hidden');
                if(est.activa) {
                    document.getElementById('lobby-jugador').classList.add('hidden');
                    document.getElementById('panel-jugador').classList.remove('hidden');
                    bloqueado = est.bloqueado;
                    document.getElementById('tema-jugador').innerText = bloqueado ? "🔒 BLOQUEADO" : "TEMA: " + est.pregunta;
                    document.getElementById('tema-jugador').style.background = bloqueado ? "#d63031" : "#fbc531";
                } else {
                    document.getElementById('panel-jugador').classList.add('hidden');
                    document.getElementById('lobby-jugador').classList.remove('hidden');
                    document.getElementById('txt-espera').innerText = "Esperando a " + est.organizadorActual + "...";
                    document.getElementById('wait-room-id').innerText = "SALA: " + roomID;
                }
            }
        });

        database.ref('salas/'+roomID+'/jugadores').on('value', snap => {
            const gal = document.getElementById('galeria-jugadores'); if(!gal) return;
            gal.innerHTML = "";
            snap.forEach(j => {
                if(j.val().visible) gal.innerHTML += `<div class="reveal-card"><b>${j.val().nombre}</b><img src="${j.val().dibujo}" onclick="openZoom('${j.val().nombre}', this.src)"></div>`;
            });
        });
    }

    function iniciarPartida() {
        const t = document.getElementById('input-tema').value.trim();
        if(!t) return alert("Pon un tema");
        const r = document.getElementById('check-random').checked;
        database.ref('salas/'+roomID+'/estado').update({ pregunta: t, activa: true, bloqueado: false, rotar: r });
    }

    function entrarLobbyJugador() {
        const n = document.getElementById('input-nombre').value.trim();
        const r = document.getElementById('input-sala').value.trim();
        if(!n || !r) return alert("Faltan datos");
        database.ref('salas/'+r).once('value', snap => {
            if(!snap.exists()) return alert("No existe");
            miNombre = n; roomID = r;
            localStorage.setItem('pt_room', roomID); localStorage.setItem('pt_name', miNombre);
            database.ref('salas/'+roomID+'/jugadores/'+miNombre).set({ nombre: miNombre, visible: false });
            vincularLobby(); escucharEstado();
        });
    }

    function escucharPizarrasVivo() {
        database.ref('salas/'+roomID+'/jugadores').on('value', snap => {
            const b = document.getElementById('pizarras-org-vivas'); if(!b) return; b.innerHTML = "";
            snap.forEach(j => {
                if(j.val().nombre !== miNombre) {
                    b.innerHTML += `<div class="org-card"><img src="${j.val().dibujo || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'}" onclick="openZoom('${j.val().nombre}', this.src)"><span><b>${j.val().nombre}</b></span><button class="btn-success" onclick="revelar('${j.val().nombre}', ${!j.val().visible})">${j.val().visible ? '👁️ OK' : '👁️ REVELAR'}</button></div>`;
                }
            });
        });
    }

    function bloquear(v) { database.ref('salas/'+roomID+'/estado').update({ bloqueado: v }); }
    function revelar(n, v) { database.ref('salas/'+roomID+'/jugadores/'+n).update({ visible: v }); }
    
    function nuevaRonda() {
        database.ref('salas/'+roomID).once('value', snap => {
            const sala = snap.val();
            let proximo = miNombre;
            if(sala.estado.rotar) {
                const todos = []; snap.child('jugadores').forEach(j => todos.push(j.val().nombre));
                let pasaron = sala.estado.historialAdmins || [];
                let candidatos = todos.filter(j => !pasaron.includes(j));
                if(candidatos.length === 0) { pasaron = []; candidatos = todos; }
                proximo = candidatos[Math.floor(Math.random() * candidatos.length)];
                pasaron.push(proximo);
                database.ref('salas/'+roomID+'/estado').update({ historialAdmins: pasaron });
            }
            database.ref('salas/'+roomID+'/estado').update({ pregunta: "", activa: false, organizadorActual: proximo, bloqueado: false });
            snap.child('jugadores').forEach(j => { j.ref.update({ dibujo: "", visible: false }); });
            localStorage.removeItem('pt_backup');
            ctx.clearRect(0,0,500,500);
        });
    }

    function limpiarSala() { if(confirm("¿Cerrar?")) { database.ref('salas/'+roomID).remove(); irInicio(); } }

    const getPos = (e) => { 
        const r = canvas.getBoundingClientRect(); const scaleX = canvas.width / r.width; const scaleY = canvas.height / r.height;
        const x = e.touches ? e.touches[0].clientX : e.clientX; const y = e.touches ? e.touches[0].clientY : e.clientY; 
        return { x: (x - r.left) * scaleX, y: (y - r.top) * scaleY }; 
    };
    function getCanvasData() { const temp = document.createElement('canvas'); temp.width = 500; temp.height = 500; const tCtx = temp.getContext('2d'); tCtx.fillStyle = "#FFF"; tCtx.fillRect(0,0,500,500); tCtx.drawImage(canvas,0,0); return temp.toDataURL("image/jpeg", 0.7); }
    const updateV = () => { if(!bloqueado && roomID && miNombre) { const d = getCanvasData(); database.ref('salas/'+roomID+'/jugadores/'+miNombre).update({ dibujo: d }); localStorage.setItem('pt_backup', d); } };
    canvas.addEventListener('mousedown', (e) => { if(!bloqueado){ dibujando=true; ctx.beginPath(); const p=getPos(e); ctx.moveTo(p.x, p.y); ctx.lineWidth=size; ctx.lineCap="round"; ctx.strokeStyle=(tool==='pincel')?colorActual:"#FFF"; }});
    canvas.addEventListener('mousemove', (e) => { if(dibujando && !bloqueado){ const p=getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }});
    window.addEventListener('mouseup', () => { if(dibujando) updateV(); dibujando=false; });
    canvas.addEventListener('touchstart', (e) => { if(!bloqueado){ e.preventDefault(); dibujando=true; ctx.beginPath(); const p=getPos(e); ctx.moveTo(p.x, p.y); ctx.lineWidth=size; ctx.lineCap="round"; ctx.strokeStyle=(tool==='pincel')?colorActual:"#FFF"; }});
    canvas.addEventListener('touchmove', (e) => { if(dibujando && !bloqueado){ e.preventDefault(); const p=getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }});
    canvas.addEventListener('touchend', () => { if(dibujando) updateV(); dibujando=false; });
    function borrar() { if(confirm("¿Borrar?")) { ctx.clearRect(0,0,500,500); localStorage.removeItem('pt_backup'); updateV(); } }
    function mostrarUnirse() { document.getElementById('menu-inicio').classList.add('hidden'); document.getElementById('pantalla-unirse').classList.remove('hidden'); }
</script>
</body>
</html>
